---
# =============================================================
# cPanel deployment tasks (Uni B Agency CI/CD SOP §3.2)
#
# This file is required by cPanel's Git Version Control. Without it
# the "Deploy HEAD Commit" button stays greyed out (SOP §13).
#
# NOTE ON STRATEGY:
# The subdomain's Document Root should point at
#   $HOME/btrc_app/public
# so the cloned repository IS the served site. There is no copy step
# and therefore no chance of the served files drifting from git.
#
# $HOME is used rather than a hardcoded /home/<user> path: cPanel runs
# these tasks as the account owner, so the username never has to be
# committed to the repository.
#
# Primary deployment is GitHub Actions (.github/workflows/deploy.yml).
# These tasks are the manual fallback via the cPanel UI.
# =============================================================
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/btrc_app
    # Directories readable by the web server, files not world-writable.
    - /bin/find $DEPLOYPATH/public -type d -exec chmod 755 {} \;
    - /bin/find $DEPLOYPATH/public -type f -exec chmod 644 {} \;
    - /bin/echo "Deployed $(/usr/bin/git -C $DEPLOYPATH rev-parse --short HEAD) at $(/bin/date)"

